<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1460" viewBox="0 0 760 1460">
<defs>
<!-- 구김: 큰 물결 + 날카로운 주름을 섞은 높이맵 -->
<filter id="crumple" x="-3%" y="-3%" width="106%" height="106%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="0.0028 0.0042" numOctaves="2" seed="23" result="waves"/>
  <feTurbulence type="turbulence" baseFrequency="0.0042 0.0058" numOctaves="4" seed="41" result="creases"/>
  <feComposite in="waves" in2="creases" operator="arithmetic" k2="0.35" k3="0.65" result="height"/>
  <feDisplacementMap in="SourceGraphic" in2="height" scale="7" xChannelSelector="R" yChannelSelector="G" result="warped"/>
  <feDiffuseLighting in="height" surfaceScale="11" diffuseConstant="1" lighting-color="#ffffff" result="light">
    <feDistantLight azimuth="230" elevation="58"/>
  </feDiffuseLighting>
  <feComponentTransfer in="light" result="shade">
    <feFuncR type="linear" slope="0.62" intercept="0.50"/>
    <feFuncG type="linear" slope="0.62" intercept="0.49"/>
    <feFuncB type="linear" slope="0.62" intercept="0.46"/>
  </feComponentTransfer>
  <feBlend in="warped" in2="shade" mode="multiply" result="lit"/>
  <feComposite in="lit" in2="warped" operator="in"/>
</filter>
<!-- 종이 섬유 입자 -->
<filter id="grain" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3" result="n"/>
  <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.33  0 0 0 0 0.30  0 0 0 -1.6 1.02"/>
  <feComposite in2="SourceGraphic" operator="in"/>
</filter>
<!-- 볼펜 잉크 번짐 -->
<filter id="ink" x="-5%" y="-5%" width="110%" height="110%">
  <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="5" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G" result="d"/>
  <feGaussianBlur in="d" stdDeviation="0.25"/>
</filter>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
  <feGaussianBlur stdDeviation="14"/>
</filter>
<linearGradient id="curl" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#000" stop-opacity="0"/>
  <stop offset="0.72" stop-color="#000" stop-opacity="0"/>
  <stop offset="1" stop-color="#3a3020" stop-opacity="0.10"/>
</linearGradient>
